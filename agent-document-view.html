<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submitted Documents | DBH Agent Portal</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#062b52}.top{height:70px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:42px;height:42px;border-radius:10px}.side{background:#fff;border-right:1px solid #e2e8f0;min-height:calc(100vh - 70px)}.shell{display:grid;grid-template-columns:250px 1fr}.main{max-width:1100px;width:100%;margin:auto;padding:30px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin-top:20px}.banner{background:#f0fdf4;border:1px solid #bbf7d0;padding:14px;border-radius:12px;color:#166534;font-size:12px}.docs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.doc{border:1px solid #e2e8f0;border-radius:14px;overflow:hidden}.head,.foot{padding:14px;display:flex;justify-content:space-between;gap:10px}.preview{height:300px;background:#eef3f8}.preview iframe,.preview img{width:100%;height:100%;border:0;object-fit:contain}.badge{font-size:10px;background:#f0fdf4;color:#15803d;padding:6px 8px;border-radius:20px;font-weight:800}.small{font-size:9px;color:#6b7b90;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{padding:10px 14px;border:1px solid #dbe3ec;border-radius:10px;background:#fff;color:#062b52;font-weight:800;cursor:pointer}.primary{background:#0b63ce;color:#fff;border-color:#0b63ce}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:900px){.shell{display:block}.side{min-height:auto}.docs{grid-template-columns:1fr}.main{padding:18px 12px}}</style></head><body><header class="top"><a class="brand" href="dashboard.html"><img src="https://dbanjushomes-com.onrender.com/dbh-logo.jpg" alt="DBH">D Banjus Homes Nig Ltd</a><button class="btn" id="logout"><i class="fa-solid fa-right-from-bracket"></i></button></header><div class="shell"><aside class="side" id="dbhSidebar"></aside><main class="main"><h1>Submitted Legal Documents</h1><p>You can view your two submitted documents below. They are locked and cannot be replaced from the agent portal.</p><div class="card"><div class="banner"><i class="fa-solid fa-lock"></i> Documents submitted and locked. DBH Admin will review them.</div><div class="docs" id="docs">Loading...</div><div class="actions"><a class="btn" href="dashboard.html">Dashboard</a><a class="btn primary" href="payment.html">Continue to Payment</a></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/app.js"></script><script>const S=window.supabase.createClient('https://cpgajlsyuieeengdnamy.supabase.co','sb_publishable_fbcJT-QGKyZg0tDkpbDkOQ_CcQf2ugW');const $=id=>document.getElementById(id);function esc(x){return String(x||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function boot(){try{const {data,error}=await S.auth.getSession();if(error||!data.session)throw new Error('Please sign in again.');const u=data.session.user;const {data:a,error:ae}=await S.from('agent_applications').select('id').eq('user_id',u.id).order('created_at',{ascending:false}).limit(1).maybeSingle();if(ae)throw ae;if(!a)throw new Error('Application not found.');const {data:d,error:de}=await S.from('agent_application_documents').select('document_type,storage_path,status,created_at').eq('application_id',a.id).order('created_at',{ascending:true}).limit(2);if(de)throw de;if(!d||d.length<2)throw new Error('Submitted documents not found.');let html='';for(const x of d){const {data:signed,error:se}=await S.storage.from('agent-documents').createSignedUrl(x.storage_path,600);if(se)throw se;const url=signed.signedUrl;const image=/\.(png|jpe?g)$/i.test(x.storage_path);html+='<article class="doc"><div class="head"><div><b>'+esc(x.document_type)+'</b><div class="small">Submitted '+new Date(x.created_at).toLocaleString()+'</div></div><span class="badge"><i class="fa-solid fa-lock"></i> Locked</span></div><div class="preview">'+(image?'<img src="'+esc(url)+'" alt="Submitted document">':'<iframe src="'+esc(url)+'#toolbar=1" title="Submitted PDF"></iframe>')+'</div><div class="foot"><span class="small">Private view</span><button class="btn" data-url="'+esc(url)+'">Open full view</button></div></article>'}$('docs').innerHTML=html;document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>window.open(b.dataset.url,'_blank','noopener,noreferrer'))}catch(e){$('docs').textContent=e.message}}$('logout').onclick=async()=>{await S.auth.signOut();location.href='index.html'};boot();</script></body></html>
