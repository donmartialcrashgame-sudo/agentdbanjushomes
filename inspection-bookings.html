</style></head><body><main class="wrap"><div class="head"><div><h1><i class="fa-solid fa-calendar-check"></i> Inspection bookings</h1><p>Review customer requests and confirm or decline proposed visits.</p></div><button class="refresh" id="refresh"><i class="fa-solid fa-rotate"></i> Refresh</button></div><div id="message"></div><div id="bookings" class="list"><div class="empty">Loading bookings…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/app.js?v=20261111-bookings"></script><script>
(()=>{const S=window.DBHSupabaseClient||(window.DBHSupabaseClient=window.supabase.createClient('https://cpgajlsyuieeengdnamy.supabase.co','sb_publishable_fbcJT-QGKyZg0tDkpbDkOQ_CcQf2ugW'));const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){ $('bookings').innerHTML='<div class="empty">Loading bookings…</div>';const {data:{session}}=await S.auth.getSession();if(!session){location.href='login.html';return}const r=await S.from('inspection_bookings').select('*').eq('owner_user_id',session.user.id).order('created_at',{ascending:false}).limit(100);if(r.error){$('bookings').innerHTML='<div class="empty">Could not load bookings: '+esc(r.error.message)+'</div>';return}if(!r.data?.length){$('bookings').innerHTML='<div class="empty">No inspection requests yet. New customer bookings will appear here.</div>';return}$('bookings').innerHTML=r.data.map(b=>'<article class="card"><div class="row"><div><strong>'+esc(b.property_title)+'</strong><div class="muted">'+esc(b.property_code||'DBH listing')+' · Requested '+new Date(b.created_at).toLocaleString('en-NG')+'</div><div class="muted">Preferred visit: <b>'+new Date(b.appointment_at).toLocaleString('en-NG',{dateStyle:'full',timeStyle:'short'})+'</b></div>'+(b.customer_note?'<div class="muted">Customer note: '+esc(b.customer_note)+'</div>':'')+'</div><span class="pill '+esc(b.status)+'">'+esc(b.status)+'</span></div>'+(b.response_note?'<div class="muted">Your response: '+esc(b.response_note)+'</div>':'')+(b.status==='pending'?'<div class="actions"><button class="primary" data-status="confirmed" data-id="'+b.id+'">Confirm booking</button><button data-status="declined" data-id="'+b.id+'">Decline</button></div>':'')+'</article>').join('');document.querySelectorAll('[data-status]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;const result=await S.from('inspection_bookings').update({status:btn.dataset.status,responded_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',btn.dataset.id);if(result.error)alert(result.error.message);await load()})} $('refresh').onclick=load;load();})();
</script></body></html>
