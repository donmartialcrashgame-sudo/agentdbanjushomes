<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DBH Agent Sign In</title><link rel="icon" href="https://dbanjushomes-com.onrender.com/dbh-logo.jpg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>:root{--b:#0b63ce;--n:#062b52;--m:#64748b;--l:#e2e8f0;--bg:#f5f9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:#0f172a}.box{max-width:480px;margin:8vh auto;padding:20px}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:30px;box-shadow:0 15px 45px #0827460b}.brand{display:flex;align-items:center;gap:10px;color:var(--n);font-weight:900;margin-bottom:25px}.brand img{width:45px;height:45px;border-radius:12px}small{display:block;color:var(--m);font-size:9px;letter-spacing:.1em}h1{font-size:30px;margin:0 0 8px}.sub{font-size:12px;color:var(--m);line-height:1.7}label{font-size:11px;font-weight:850;display:block;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid var(--l);border-radius:11px}button{width:100%;margin-top:18px;border:0;border-radius:11px;padding:13px;background:var(--b);color:#fff;font-weight:850}.otp{display:none}.otp.show{display:block}.msg{display:none;padding:11px;border-radius:10px;font-size:11px;margin-top:14px}.show{display:block}.err{background:#fef2f2;color:#991b1b}.ok{background:#f0fdf4;color:#166534}.back{display:block;text-align:center;color:var(--b);font-size:11px;margin-top:18px}</style></head><body><main class="box"><section class="card"><div class="brand"><img src="https://dbanjushomes-com.onrender.com/dbh-logo.jpg"><div>D Banjus Homes Nig Ltd<small>AGENT NETWORK</small></div></div><h1>Welcome back.</h1><p class="sub">Sign in with your registered email. DBH will resume your saved onboarding progress. If you sign in from another location, a new onboarding session will be recorded.</p><div id="msg" class="msg"></div><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><div class="otp" id="otp"><label>6-digit email code</label><input id="code" maxlength="6" inputmode="numeric" placeholder="000000"><button id="verify" type="button">Verify & continue</button></div><button id="send" type="button">Send sign-in code</button><a class="back" href="index.html">← Back to agent portal</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://cpgajlsyuieeengdnamy.supabase.co',K='sb_publishable_fbcJT-QGKyZg0tDkOQ_CcQf2ugW',S=window.supabase.createClient(U,K),FN=U+'/functions/v1/dbh-agent-registration',$=x=>document.getElementById(x);function msg(t,c){$('msg').textContent=t;$('msg').className='msg show '+c}async function call(){const {data,error}=await S.auth.getSession();if(error||!data.session)throw new Error('Secure login session missing.');const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({action:'get_application'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'No DBH agent application found.');return d}$('send').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!email)return msg('Enter your email address.','err');$('send').disabled=true;try{const {error}=await S.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)throw error;$('otp').classList.add('show');$('send').style.display='none';msg('Sign-in code sent. Check your email.','ok')}catch(e){msg(e.message||'Unable to send sign-in code.','err')}finally{$('send').disabled=false}};$('verify').onclick=async()=>{try{const email=$('email').value.trim().toLowerCase(),code=$('code').value.trim();if(!/^\d{6}$/.test(code))throw new Error('Enter the 6-digit code.');const {data,error}=await S.auth.verifyOtp({email,token:code,type:'email'});if(error)throw error;if(!data.session)throw new Error('Secure session was not created.');await call();location.href='agent-onboarding.html'}catch(e){msg(e.message||'Login failed.','err')}};</script></body></html>
