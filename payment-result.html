as not successful. You can return to the dashboard and try again.'}else{$('ico').innerHTML='<i class="fa-solid fa-clock"></i>';$('title').textContent='Payment is still pending';$('text').textContent='Flutterwave has not returned a final successful status yet. Your payment record remains pending.'}const c=d?.charge||{};$('meta').style.display='block';$('meta').innerHTML='<div><span>Reference</span><b>'+ref+'</b></div><div><span>Status</span><b>'+String(d?.status||'pending').toUpperCase()+'</b></div><div><span>Transaction</span><b>'+String(c.id||'—')+'</b></div>';$('btn').style.display='inline-block'}catch(e){$('ico').innerHTML='<i class="fa-solid fa-triangle-exclamation"></i>';$('title').textContent='Verification could not finish';$('text').textContent=e.message||'Please return to the dashboard and try again.';$('btn').style.display='inline-block'}}boot();</script></body></html>
