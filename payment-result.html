<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Payment Result | DBH</title><link rel="icon" href="https://dbanjushomes-com.onrender.com/dbh-logo.jpg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>:root{--b:#0b63ce;--d:#062b52;--m:#64748b;--l:#e2e8f0;--bg:#f5f9fe}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a}.top{height:72px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 6%}.brand{display:flex;gap:10px;align-items:center;color:var(--d);font-weight:900;text-decoration:none}.brand img{width:43px;height:43px;border-radius:11px;object-fit:cover}.brand small{display:block;color:var(--m);font-size:9px;letter-spacing:.12em}.wrap{max-width:600px;margin:80px auto;padding:18px}.box{background:#fff;border:1px solid var(--l);border-radius:24px;padding:38px;text-align:center}.icon{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#eff6ff;color:var(--b);font-size:27px}.box h1{margin:0;font-size:28px}.box p{font-size:11px;color:var(--m);line-height:1.7}.btn{display:inline-block;background:var(--b);color:#fff;padding:12px 18px;border-radius:11px;text-decoration:none;font-weight:900;margin-top:12px}.spin{display:inline-block;width:17px;height:17px;border:2px solid var(--b);border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.meta{margin-top:20px;text-align:left;background:#f8fafc;border:1px solid var(--l);padding:14px;border-radius:12px;font-size:10px}.meta div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.meta span{color:var(--m)}@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}.celebrate{font-size:76px;line-height:1;animation:pop .65s ease-out}.receipt{display:none;margin:22px 0 0;border:1px solid #bfdbfe;border-radius:18px;padding:18px;text-align:left;background:#f8fbff}.receipt h2{margin:0 0 10px;font-size:17px;color:var(--d)}.receipt-row{display:flex;justify-content:space-between;gap:15px;padding:7px 0;border-bottom:1px solid #e2e8f0;font-size:10px}.receipt-row:last-child{border-bottom:0}.receipt-row span{color:var(--m)}.view-receipt{display:none;background:#fff;color:var(--d);border:1px solid #cbd5e1;padding:11px 15px;border-radius:11px;text-decoration:none;font-weight:900;margin:12px 6px 0;cursor:pointer}.view-receipt.show{display:inline-block}.sticker{display:none;margin:10px 0 18px}.sticker.show{display:block}.sticker span{display:inline-flex;width:100px;height:100px;border-radius:50%;align-items:center;justify-content:center;background:#eff6ff;border:8px solid #fff;box-shadow:0 12px 30px #062b5230;font-size:55px}@media(max-width:550px){.box{padding:28px 18px}.celebrate{font-size:65px}}</style></head><body><header class="top"><a class="brand" href="dashboard.html"><img src="https://dbanjushomes-com.onrender.com/dbh-logo.jpg" alt="DBH"><div>D Banjus Homes Nig Ltd<small>PAYMENT RESULT</small></div></a></header><main class="wrap"><section class="box"><div class="icon" id="ico"><span class="spin"></span></div><div class="sticker" id="sticker"><span>🎉</span></div><h1 id="title">Checking payment...</h1><p id="text">DBH is verifying the Flutterwave transaction securely.</p><div class="meta" id="meta" style="display:none"></div><button class="view-receipt" id="viewReceipt">View Receipt</button><div class="receipt" id="receipt"></div><a class="btn" id="btn" href="dashboard.html" style="display:none">Return to dashboard</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://cpgajlsyuieeengdnamy.supabase.co',K='sb_publishable_fbcJT-QGKyZg0tDkpbDkOQ_CcQf2ugW',S=window.supabase.createClient(U,K),FN=U+'/functions/v1/dbh-agent-payment',$=x=>document.getElementById(x);async function boot(){const q=new URLSearchParams(location.search),ref=q.get('reference')||q.get('tx_ref');if(!ref){$('title').textContent='Payment reference missing';$('text').textContent='We could not identify the DBH registration payment.';$('ico').innerHTML='<i class="fa-solid fa-circle-exclamation"></i>';$('btn').style.display='inline-block';return}try{const {data,error}=await S.auth.getSession();if(error||!data.session){location.href='login.html';return}const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({action:'verify',reference:ref})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Verification failed.');const st=d.status;if(st==='successful'){$('ico').innerHTML='<span class="celebrate">🎉</span>';$('sticker').classList.add('show');$('title').textContent='Registration fee paid successfully!';$('text').textContent='Your DBH registration payment has been verified. Admin approval is still required.';$('viewReceipt').classList.add('show');$('viewReceipt').onclick=()=>{const rbox=$('receipt');rbox.style.display=rbox.style.display==='block'?'none':'block';rbox.innerHTML='<h2>DBH Registration Payment Receipt</h2><div class="receipt-row"><span>Status</span><b>PAID</b></div><div class="receipt-row"><span>Reference</span><b>'+ref+'</b></div><div class="receipt-row"><span>Transaction</span><b>'+String(d.charge?.id||'—')+'</b></div><div class="receipt-row"><span>Date</span><b>'+new Date().toLocaleString()+'</b></div><div class="receipt-row"><span>Provider</span><b>Flutterwave</b></div>'}}else if(st==='failed'){$('ico').innerHTML='<i class="fa-solid fa-xmark"></i>';$('title').textContent='Payment failed';$('text').textContent='The registration payment was not successful. Return to the dashboard and try again.'}else{$('ico').innerHTML='<i class="fa-solid fa-clock"></i>';$('title').textContent='Payment is still pending';$('text').textContent='Flutterwave has not returned a final successful status yet. You can check again later.'}$('meta').style.display='block';$('meta').innerHTML='<div><span>Reference</span><b>'+ref+'</b></div><div><span>Status</span><b>'+String(st||'pending').toUpperCase()+'</b></div><div><span>Transaction</span><b>'+String(d.charge?.id||'—')+'</b></div>';$('btn').style.display='inline-block'}catch(e){$('ico').innerHTML='<i class="fa-solid fa-triangle-exclamation"></i>';$('title').textContent='Verification could not finish';$('text').textContent=e.message||'Please return to the dashboard and try again.';$('btn').style.display='inline-block'}}boot();</script></body></html>
